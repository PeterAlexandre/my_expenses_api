[project]
name = "my-expenses-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.27.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.2.2",
    "pydantic-settings>=2.13.1",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.12.5",
    "argon2-cffi>=25.1.0",
    "pwdlib>=0.3.0",
    "pyjwt>=2.12.1",
    "python-multipart>=0.0.22",
    "alembic>=1.18.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.8",
]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ['I', 'F', 'E', 'W', 'PL', 'PT']
preview = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
