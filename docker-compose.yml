services:
  postgres:
    image: postgres:16-alpine
    container_name: expenses_api_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-expenses_db}
      POSTGRES_USER: ${POSTGRES_USER:-expenses_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expenses_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expenses_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - expenses_network

networks:
  expenses_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
